# hopparch: kernel swap values for zram (swap that is compressed memory, not a
# disk). The defaults (60, 3, 15000, 10) assume a slow disk.
# swappiness 180: swap early; putting a page into zram is cheaper than
#   dropping a file page that has to be read from the disk again.
# page-cluster 0: read one page per swap-in, not 8; reading ahead only pays on
#   a disk that seeks.
# watermark_*: keep a little more memory free and never "boost" reclaim, so
#   there is room to compress into when memory runs short.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
