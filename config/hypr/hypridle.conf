# hopparch idle/sleep. Runs on every machine so the screen is always locked
# before any sleep (power menu, laptop lid). There is no idle timer: a machine
# sleeps only when told to (power menu) or, on a laptop, when the lid closes.
# A timer once put a laptop to sleep in the middle of a backup (11-03).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}
